# Netlify config for the Zumfi site.
#
# index.html is self-contained — inline CSS, inline SVG, no framework — so there
# is nothing to build. Netlify just serves export/zumfi-site as the site root.
#
# This file lives on the Zumfi branch only. The photography site on main deploys
# elsewhere (see export/levi-seydou-site/vercel.json) and is unaffected.

[build]
  publish = "export/zumfi-site"

# README.md sits next to index.html so it travels with the code, but it is
# internal: design notes, open issues, and a list of the partner-only material
# deliberately kept off the public page. Don't serve it.
[[redirects]]
  from = "/README.md"
  to = "/"
  status = 301
  force = true
